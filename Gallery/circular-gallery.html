<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Gallery</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0b0b;
      overflow: hidden;
    }

    #gallery-wrapper {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    .circular-gallery {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      position: relative;
      /* gives the curved items a sense of depth without WebGL */
      perspective: 1400px;
    }

    .circular-gallery:active {
      cursor: grabbing;
    }

    .circular-gallery:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .gallery-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .gallery-item {
      position: absolute;
      top: 50%;
      left: 50%;
      will-change: transform;
      /* transform-origin stays centered so rotation/arc math lines up
         with the translate values computed in JS */
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .gallery-item-inner {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: var(--gallery-border-radius, 12px);
      background: #1a1a1a;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      /* prevents native drag-ghost image on desktop browsers */
      -webkit-user-drag: none;
    }

    .gallery-title {
      position: absolute;
      left: 50%;
      top: calc(100% + 18px);
      transform: translateX(-50%);
      white-space: nowrap;
      color: var(--gallery-text-color, #ffffff);
      font: var(--gallery-font, bold 20px Figtree, sans-serif);
      letter-spacing: 0.02em;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="gallery-wrapper">
    <div id="gallery-container" class="circular-gallery" tabindex="0" role="region"
      aria-label="Circular image gallery. Use left and right arrow keys to navigate.">
      <div class="gallery-track" id="gallery-track"></div>
    </div>
  </div>

  <script>
    /* ------------------------------------------------------------------ */
    /* Config — edit these to change gallery content / behaviour          */
    /* ------------------------------------------------------------------ */
    const CONFIG = {
      // Local images only. Point these at files sitting next to this HTML
      // file (e.g. an "images" folder you copy alongside it), or any
      // relative/local path. Remote URLs are intentionally not used.
      items: [
        { image: "circular-gallery-images/2023.jpg", text: "2021" },
        { image: "circular-gallery-images/02021.png", text: "2021" },
        { image: "circular-gallery-images/02022.png", text: "2022" },
        { image: "circular-gallery-images/12022.jpg", text: "2022" },
        { image: "circular-gallery-images/02023.jpg", text: "2023" },
        { image: "circular-gallery-images/12023.jpg", text: "2023" },
        { image: "circular-gallery-images/2024.jpg", text: "2024" },
        { image: "circular-gallery-images/02024.jpg", text: "2024" },
        { image: "circular-gallery-images/12024.jpg", text: "2024" },
        { image: "circular-gallery-images/22024.jpg", text: "2024" },
        { image: "circular-gallery-images/2025.jpg", text: "2025" },
        { image: "circular-gallery-images/02025.jpg", text: "2025" },
        { image: "circular-gallery-images/12025.jpg", text: "2025" },
        { image: "circular-gallery-images/22025.jpg", text: "2025" },
        { image: "circular-gallery-images/2026.jpg", text: "2026" },
        { image: "circular-gallery-images/02026.jpg", text: "2026" },
        { image: "circular-gallery-images/12026.jpg", text: "2026" },
        { image: "circular-gallery-images/42026.jpg", text: "2026" },
      ],
      bend: 220,          // curvature strength in pixels (0 = flat line)
      textColor: "#ffffff",
      borderRadius: 16,   // px
      font: "bold 22px Figtree, sans-serif",
      fontUrl: "https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap",
      scrollSpeed: 2,
      scrollEase: 0.08,
      itemWidthRatio: 0.28,   // Desktop base width ratio
      itemAspect: 900 / 700   // height / width, matches original plane proportions
    };

    /* ------------------------------------------------------------------ */
    /* Helpers                                                            */
    /* ------------------------------------------------------------------ */
    function debounce(fn, wait) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(null, args), wait);
      };
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function loadFontStylesheet(url) {
      return new Promise(resolve => {
        if (!url) return resolve();
        const existing = document.querySelector(`link[href="${url}"]`);
        if (existing) return resolve();
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = url;
        link.onload = () => resolve();
        link.onerror = () => resolve(); // don't block the gallery on a font failure
        document.head.appendChild(link);
      });
    }

    // A neutral placeholder shown if a local image path can't be found,
    // so the gallery still renders correctly before real images are added.
    const PLACEHOLDER_SVG =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="700" height="900">
          <rect width="100%" height="100%" fill="#242424"/>
          <text x="50%" y="50%" fill="#8a8a8a" font-family="sans-serif" font-size="28"
                text-anchor="middle" dominant-baseline="middle">image not found</text>
        </svg>
      `);

    /* ------------------------------------------------------------------ */
    /* Gallery item — one <img> + label, positioned with CSS transforms   */
    /* ------------------------------------------------------------------ */
    class GalleryItem {
      constructor({ container, image, text, index, length, bend, textColor, borderRadius, font }) {
        this.container = container;
        this.index = index;
        this.length = length;
        this.bend = bend;
        this.extra = 0;

        this.el = document.createElement("div");
        this.el.className = "gallery-item";

        this.inner = document.createElement("div");
        this.inner.className = "gallery-item-inner";
        this.inner.style.setProperty("--gallery-border-radius", `${borderRadius}px`);

        this.img = document.createElement("img");
        this.img.src = image;
        this.img.alt = text || "";
        this.img.draggable = false;
        this.img.onerror = () => {
          console.warn(`CircularGallery: failed to load local image "${image}"`);
          this.img.src = PLACEHOLDER_SVG;
        };

        this.inner.appendChild(this.img);
        this.el.appendChild(this.inner);

        if (text) {
          this.titleEl = document.createElement("div");
          this.titleEl.className = "gallery-title";
          this.titleEl.textContent = text;
          this.titleEl.style.setProperty("--gallery-text-color", textColor);
          this.titleEl.style.setProperty("--gallery-font", font);
          this.el.appendChild(this.titleEl);
        }

        this.container.appendChild(this.el);
      }

      onResize({ screen, itemWidthRatio, itemAspect, padding }) {
        this.screen = screen;
        this.width = screen.width * itemWidthRatio;
        this.height = this.width * itemAspect;
        this.el.style.width = `${this.width}px`;
        this.el.style.height = `${this.height}px`;

        this.padding = padding;
        this.step = this.width + this.padding;
        this.widthTotal = this.step * this.length;
        this.x = this.step * this.index;
      }

      update(scroll, direction) {
        const posX = this.x - scroll.current - this.extra;
        const H = this.screen.width / 2;

        let posY = 0;
        let rotationDeg = 0;

        if (this.bend !== 0) {
          const B = Math.abs(this.bend);
          const R = (H * H + B * B) / (2 * B);
          const effectiveX = Math.min(Math.abs(posX), H);
          const arc = R - Math.sqrt(Math.max(R * R - effectiveX * effectiveX, 0));
          const angle = Math.asin(effectiveX / R);

          if (this.bend > 0) {
            posY = -arc;
            rotationDeg = (-Math.sign(posX) * angle * 180) / Math.PI;
          } else {
            posY = arc;
            rotationDeg = (Math.sign(posX) * angle * 180) / Math.PI;
          }
        }

        this.el.style.transform =
          `translate3d(${posX - this.width / 2}px, ${posY - this.height / 2}px, 0) rotate(${rotationDeg}deg)`;

        const halfWidth = this.width / 2;
        const halfScreen = this.screen.width / 2;
        this.isBefore = posX + halfWidth < -halfScreen;
        this.isAfter = posX - halfWidth > halfScreen;

        if (direction === "right" && this.isBefore) {
          this.extra -= this.widthTotal;
          this.isBefore = this.isAfter = false;
        }
        if (direction === "left" && this.isAfter) {
          this.extra += this.widthTotal;
          this.isBefore = this.isAfter = false;
        }
      }
    }

    /* ------------------------------------------------------------------ */
    /* App                                                                */
    /* ------------------------------------------------------------------ */
    class App {
      constructor(container, track, opts) {
        this.container = container;
        this.track = track;
        this.opts = opts;
        this.scroll = { ease: opts.scrollEase, current: 0, target: 0, last: 0 };
        this.onCheckDebounce = debounce(this.onCheck.bind(this), 200);

        this.createMedias();
        this.onResize();
        this.addEventListeners();
        this.update();
      }

      createMedias() {
        const items = this.opts.items && this.opts.items.length ? this.opts.items : [];
        // duplicate the list, matching the original component's approach,
        // so the wrap-around loop always has enough items on screen
        this.itemsData = items.concat(items);
        this.medias = this.itemsData.map((data, index) =>
          new GalleryItem({
            container: this.track,
            image: data.image,
            text: data.text,
            index,
            length: this.itemsData.length,
            bend: this.opts.bend,
            textColor: this.opts.textColor,
            borderRadius: this.opts.borderRadius,
            font: this.opts.font
          })
        );
      }

      onResize() {
        this.screen = {
          width: this.container.clientWidth,
          height: this.container.clientHeight
        };

        // Mobile screening adjustment for larger cards:
        const isMobile = this.screen.width < 768;
        const activeRatio = isMobile ? 0.65 : this.opts.itemWidthRatio; // Mobile par 65% width cover karega
        const padding = isMobile ? this.screen.width * 0.08 : this.screen.width * 0.02;

        this.medias.forEach(media =>
          media.onResize({
            screen: this.screen,
            itemWidthRatio: activeRatio,
            itemAspect: this.opts.itemAspect,
            padding
          })
        );
      }

      onTouchDown(e) {
        this.isDown = true;
        this.scroll.position = this.scroll.current;
        this.start = e.touches ? e.touches[0].clientX : e.clientX;
      }

      onTouchMove(e) {
        if (!this.isDown) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const distance = (this.start - x) * (this.opts.scrollSpeed * 0.025) * 20;
        this.scroll.target = this.scroll.position + distance;
      }

      onTouchUp() {
        this.isDown = false;
        this.onCheck();
      }

      onWheel(e) {
        const delta = e.deltaY || e.wheelDelta || e.detail;
        this.scroll.target += (delta > 0 ? this.opts.scrollSpeed : -this.opts.scrollSpeed) * 20;
        this.onCheckDebounce();
      }

      onKeyDown(e) {
        switch (e.key) {
          case "ArrowRight":
            e.preventDefault();
            this.scroll.target += this.opts.scrollSpeed * 100;
            this.onCheckDebounce();
            break;
          case "ArrowLeft":
            e.preventDefault();
            this.scroll.target -= this.opts.scrollSpeed * 100;
            this.onCheckDebounce();
            break;
          case "Home":
            e.preventDefault();
            this.scroll.target = 0;
            this.onCheckDebounce();
            break;
          default:
            break;
        }
      }

      onCheck() {
        const first = this.medias[0];
        if (!first || !first.step) return;
        const step = first.step;
        const itemIndex = Math.round(Math.abs(this.scroll.target) / step);
        const snapped = step * itemIndex;
        this.scroll.target = this.scroll.target < 0 ? -snapped : snapped;
      }

      update() {
        this.scroll.current = lerp(this.scroll.current, this.scroll.target, this.scroll.ease);
        const direction = this.scroll.current > this.scroll.last ? "right" : "left";
        this.medias.forEach(media => media.update(this.scroll, direction));
        this.scroll.last = this.scroll.current;
        this.raf = window.requestAnimationFrame(this.update.bind(this));
      }

      addEventListeners() {
        this.boundOnResize = this.onResize.bind(this);
        this.boundOnWheel = this.onWheel.bind(this);
        this.boundOnTouchDown = this.onTouchDown.bind(this);
        this.boundOnTouchMove = this.onTouchMove.bind(this);
        this.boundOnTouchUp = this.onTouchUp.bind(this);
        this.boundOnKeyDown = this.onKeyDown.bind(this);

        window.addEventListener("resize", this.boundOnResize);
        this.container.addEventListener("wheel", this.boundOnWheel, { passive: true });
        this.container.addEventListener("mousedown", this.boundOnTouchDown);
        window.addEventListener("mousemove", this.boundOnTouchMove);
        window.addEventListener("mouseup", this.boundOnTouchUp);
        this.container.addEventListener("touchstart", this.boundOnTouchDown, { passive: true });
        window.addEventListener("touchmove", this.boundOnTouchMove, { passive: true });
        window.addEventListener("touchend", this.boundOnTouchUp);
        this.container.addEventListener("keydown", this.boundOnKeyDown);
      }

      destroy() {
        window.cancelAnimationFrame(this.raf);
        window.removeEventListener("resize", this.boundOnResize);
        this.container.removeEventListener("wheel", this.boundOnWheel);
        this.container.removeEventListener("mousedown", this.boundOnTouchDown);
        window.removeEventListener("mousemove", this.boundOnTouchMove);
        window.removeEventListener("mouseup", this.boundOnTouchUp);
        this.container.removeEventListener("touchstart", this.boundOnTouchDown);
        this.container.removeEventListener("touchmove", this.boundOnTouchMove);
        this.container.removeEventListener("touchend", this.boundOnTouchUp);
        this.container.removeEventListener("keydown", this.boundOnKeyDown);
        this.track.innerHTML = "";
      }
    }

    /* ------------------------------------------------------------------ */
    /* Bootstrap                                                          */
    /* ------------------------------------------------------------------ */
    const container = document.getElementById("gallery-container");
    const track = document.getElementById("gallery-track");
    let currentApp = null;

    loadFontStylesheet(CONFIG.fontUrl).then(() => {
      currentApp = new App(container, track, CONFIG);
    });

    window.addEventListener("beforeunload", () => {
      if (currentApp) currentApp.destroy();
    });
  </script>

</body>

</html>
