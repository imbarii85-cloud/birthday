<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Dome Video Gallery — Dynamic Responsive</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #0B1F3A;
      --navy-deep: #071429;
      --gold: #F4B942;
      --coral: #FF6F61;
      --cream: #FDF6E9;
      --radius: 560px;
      --tile-size: 130px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at top, var(--navy) 0%, var(--navy-deep) 70%);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: var(--cream);
    }

    .page-head {
      position: absolute;
      top: 16px;
      left: 12px;
      right: 12px;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .page-head h1 {
      font-family: 'Baloo 2', sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      color: var(--gold);
      margin: 0 0 4px;
    }

    .page-head p {
      margin: 0;
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      opacity: 0.8;
    }

    /* ===== DOME ROOT ===== */
    .dome-root {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .dome-main {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }

    .dome-main.dragging {
      cursor: grabbing;
    }

    .dome-stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: calc(var(--radius) * 2);
      perspective-origin: 50% 50%;
    }

    .dome-sphere {
      transform-style: preserve-3d;
      transform: translateZ(calc(var(--radius) * -1));
      will-change: transform;
    }

    .dome-item {
      position: absolute;
      top: -999px;
      bottom: -999px;
      left: -999px;
      right: -999px;
      margin: auto;
      width: var(--tile-size);
      height: var(--tile-size);
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .dome-tile {
      position: absolute;
      inset: 4px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background: #0E2648;
      border: 1px solid rgba(244, 185, 66, 0.3);
      transition: transform 0.25s ease, border-color 0.25s ease, filter 0.25s ease;
      filter: saturate(0.85) brightness(0.9);
    }

    .dome-tile:hover,
    .dome-tile:active {
      transform: scale(1.08);
      border-color: rgba(244, 185, 66, 0.9);
      filter: saturate(1) brightness(1);
      z-index: 5;
    }

    .dome-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .dome-tile .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 20, 41, 0.25);
      pointer-events: none;
    }

    .dome-tile .play-badge svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    }

    /* Outer Title Overlay (Commented Out As Requested) */
    /* 
    .dome-tile .tile-title-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 6px;
      background: linear-gradient(to top, rgba(7, 20, 41, 0.95), transparent);
      font-size: 0.65rem;
      color: var(--cream);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    } 
    */

    /* Radial overlay & Edge fades */
    .dome-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(rgba(235, 235, 235, 0) 50%, var(--navy-deep) 100%);
    }

    .dome-edge-fade {
      position: absolute;
      left: 0;
      right: 0;
      height: 100px;
      z-index: 4;
      pointer-events: none;
    }

    .dome-edge-fade--top {
      top: 0;
      background: linear-gradient(to bottom, var(--navy-deep), transparent);
    }

    .dome-edge-fade--bottom {
      bottom: 0;
      background: linear-gradient(to top, var(--navy-deep), transparent);
    }

    .dome-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-size: 0.75rem;
      color: rgba(253, 246, 233, 0.6);
      text-align: center;
      pointer-events: none;
      width: 90%;
    }

    /* ===== VIEWER POPUP ===== */
    .dome-viewer {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 16px;
    }

    .dome-scrim {
      position: absolute;
      inset: 0;
      background: rgba(3, 6, 15, 0.88);
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .dome-root[data-open="true"]~.dome-viewer .dome-scrim {
      opacity: 1;
      pointer-events: auto;
    }

    .dome-video-frame {
      position: relative;
      width: auto;
      height: auto;
      max-width: min(92vw, 800px);
      max-height: 80vh;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      transform: scale(0.7);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.3s ease;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .dome-root[data-open="true"]~.dome-viewer .dome-video-frame {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .dome-video-frame video {
      display: block;
      max-width: 100%;
      max-height: calc(80vh - 45px);
      width: auto;
      height: auto;
      object-fit: contain;
      background: #000;
    }

    .dome-drive-frame {
      display: block;
      width: min(92vw, 800px);
      height: min(60vh, 450px);
      border: none;
      background: #000;
    }

    .dome-video-header {
      width: 100%;
      padding: 10px 14px;
      background: rgba(7, 20, 41, 0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(244, 185, 66, 0.2);
    }

    .dome-caption {
      font-family: 'Baloo 2', sans-serif;
      font-size: clamp(0.85rem, 3vw, 1.05rem);
      color: var(--gold);
      margin: 0;
      padding-right: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dome-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(244, 185, 66, 0.4);
      color: var(--gold);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .dome-video-frame .no-src-msg {
      padding: 30px 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--cream);
      background: linear-gradient(160deg, #16345E, #0A1D38);
    }

    @media (max-width: 600px) {
      :root {
        --radius: 360px;
        --tile-size: 95px;
      }

      .dome-edge-fade {
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <div class="page-head">
    <h1>🎥 Hamari Yaadgar Videos</h1>
    <p>Ghumao (drag karo) aur kisi bhi video par click karo</p>
  </div>

  <div class="dome-root" id="domeRoot">
    <main class="dome-main" id="domeMain">
      <div class="dome-stage">
        <div class="dome-sphere" id="domeSphere"></div>
      </div>
      <div class="dome-overlay"></div>
      <div class="dome-edge-fade dome-edge-fade--top"></div>
      <div class="dome-edge-fade dome-edge-fade--bottom"></div>
    </main>
    <div class="dome-hint">🖱️ Touch ya drag karke ghumao • Video par click karke kholo</div>
  </div>

  <div class="dome-viewer">
    <div class="dome-scrim" id="domeScrim"></div>
    <div class="dome-video-frame" id="domeVideoFrame">
      <div class="dome-video-header">
        <div class="dome-caption" id="domeCaption">Loading...</div>
        <button class="dome-close" id="domeClose">✕</button>
      </div>
      <video id="domePlayer" controls playsinline></video>
    </div>
  </div>

  <script>
    // ===== VIDEO & POSTER LIST =====
    // Agar automatic thumbnail nahi chal raha toh 'poster' mein apni image ka path daal dein:
    // Example: { src: 'vid1.mp4', poster: 'pic1.jpg', title: 'Hamari Pehli Mulaqaat' }
    const videoItems = [
      // { src: 'vid1.mp4', poster: null, title: 'Hamari Pehli Mulaqaat' },
      { src: 'vid1.mp4', poster: null, title: "vid 1" },
      { src: 'vid2.mp4', poster: null, title: "vid 2" },
      { src: 'vid3.mp4', poster: null, title: "vid 3" },
      { src: 'vid4.mp4', poster: null, title: "vid 4" },
      { src: 'vid5.mp4', poster: null, title: "vid 5" },
      { src: 'vid6.mp4', poster: null, title: "vid 6" },
      { src: 'vid7.mp4', poster: null, title: "vid 7" },
      { src: 'vid8.mp4', poster: null, title: "vid 8" },
      { src: 'vid9.mp4', poster: null, title: "vid 9" },
      { src: 'vid10.mp4', poster: null, title: "vid 10" },
      { src: 'vid11.mp4', poster: null, title: "vid 11" },
      { src: 'vid12.mp4', poster: null, title: "vid 12" },
      { src: 'vid13.mp4', poster: null, title: "vid 13" },
      { src: 'vid14.mp4', poster: null, title: "vid 14" },
      { src: 'vid15.mp4', poster: null, title: "vid 15" },
      { src: 'vid16.mp4', poster: null, title: "vid 16" },
      { src: 'vid17.mp4', poster: null, title: "vid 17" },
      { src: 'vid18.mp4', poster: null, title: "vid 18" },
      { src: 'vid19.mp4', poster: null, title: "vid 19" },
      { src: 'https://drive.google.com/file/d/1feYkVlgQgs0RdeEI9NKqFMTIh6QdWohn/view?usp=drive_link', poster: null, title: "vid 21" },
      { src: 'https://drive.google.com/file/d/1AKSARVvjNqm6Ehzt6jOx3iuwy4JGxKdx/view?usp=drive_link', poster: null, title: "vid 22" },
      { src: 'https://drive.google.com/file/d/1H74XzU97CQWWJIuUet7o_BkbNYTAZO5M/view?usp=drive_link', poster: null, title: "vid 23" },
      { src: 'https://drive.google.com/file/d/1EOt9pE1mVc9jS6VVDYSXIzsTEFEwuvS-/view?usp=drive_link', poster: null, title: "vid 24" },
      { src: 'https://drive.google.com/file/d/1FJ1PMpYpfqh_c0WdZGWfTvtf5OyvYUbI/view?usp=drive_link', poster: null, title: "vid 25" },
      { src: 'https://drive.google.com/file/d/1OrL5egRTgcBZR7cMtq4PCK-CphPsH7oy/view?usp=drive_link', poster: null, title: "vid 26" },
      { src: 'https://drive.google.com/file/d/1pwo6Z_UzoZ4V15sJOqfdwVUFPsPJKrHs/view?usp=drive_link', poster: null, title: "vid 27" },
      { src: 'https://drive.google.com/file/d/1Uq7n9UPNs9x5gw8wMZVFfiRzQJkDEH7o/view?usp=drive_link', poster: null, title: "vid 28" },
      { src: 'https://drive.google.com/file/d/1Fd-XyX8RQ7EL4dPI2PTti4mgkJGerHL4/view?usp=drive_link', poster: null, title: "vid 29" },
      { src: 'https://drive.google.com/file/d/1GasdJzVX8J6zdrccv83UW45qgbCLPj4p/view?usp=drive_link', poster: null, title: "vid 31" },
      { src: 'https://drive.google.com/file/d/1h_MDYWIB-1Nd0tuzoa8LbjlZvqPuXE3V/view?usp=drive_link', poster: null, title: "vid 32" },
      { src: 'https://drive.google.com/file/d/1vcT7IoxRIO3qprQYqMzUbgavfNTRiwOn/view?usp=drive_link', poster: null, title: "vid 33" },
      { src: 'https://drive.google.com/file/d/1FOWcP-aFFbYQnwsYdWLpMfswbUckZI53/view?usp=drive_link', poster: null, title: "vid 34" },
    ];
    function autoTitle(src, manualTitle) {
      if (manualTitle) return manualTitle;
      if (!src) return 'Untitled Video';

      const fileName = src.split('/').pop().split('.')[0];
      return fileName
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, l => l.toUpperCase());
    }

    const placeholderColors = ['244,185,66', '255,111,97', '139,157,195', '46,125,79'];
    function placeholderPoster(index) {
      const color = placeholderColors[index % placeholderColors.length];
      const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="rgb(${color})" opacity="0.35"/>
      <polygon points="82,70 82,130 135,100" fill="rgb(${color})"/>
    </svg>`;
      return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }

    function extractThumbnail(src, seekTime = 1) {
      return new Promise(resolve => {
        if (!src) return resolve(null);

        const vid = document.createElement('video');
        vid.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px';
        vid.muted = true;
        vid.preload = 'metadata';
        vid.crossOrigin = 'anonymous';
        document.body.appendChild(vid);

        const cleanup = () => { try { document.body.removeChild(vid); } catch (_) { } };

        const onSeeked = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = vid.videoWidth || 320;
            canvas.height = vid.videoHeight || 180;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            cleanup();
            resolve(dataUrl);
          } catch (err) {
            cleanup();
            resolve(null);
          }
        };

        vid.addEventListener('seeked', onSeeked, { once: true });
        vid.addEventListener('error', () => { cleanup(); resolve(null); }, { once: true });

        vid.src = src;
        vid.addEventListener('loadedmetadata', () => {
          vid.currentTime = Math.min(seekTime, vid.duration * 0.1 || seekTime);
        }, { once: true });
      });
    }

    // ===== BUILD SPHERE =====
    const SEGMENTS = window.innerWidth < 600 ? 16 : 22;

    function getRadius() {
      return window.innerWidth < 600 ? 360 : 560;
    }

    function buildTiles(pool, segments) {
      const xCols = Array.from({ length: segments }, (_, i) => (i - (segments - 1) / 2) * 2);
      const evenYs = [-4, -2, 0, 2, 4];
      const oddYs = [-3, -1, 1, 3, 5];

      const coords = xCols.flatMap((x, c) => {
        const ys = c % 2 === 0 ? evenYs : oddYs;
        return ys.map(y => ({ x, y }));
      });

      return coords.map((c, i) => ({ ...c, item: pool[i % pool.length], index: i % pool.length }));
    }

    const tiles = buildTiles(videoItems, SEGMENTS);
    const unit = 360 / SEGMENTS / 2;
    const sphere = document.getElementById('domeSphere');

    tiles.forEach(t => {
      const radius = getRadius();
      const rotateY = unit * t.x;
      const rotateX = unit * t.y;

      const wrap = document.createElement('div');
      wrap.className = 'dome-item';
      wrap.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg) translateZ(${radius}px)`;

      const tile = document.createElement('div');
      tile.className = 'dome-tile';
      tile.dataset.index = t.index;

      const titleText = autoTitle(t.item.src, t.item.title);

      const img = document.createElement('img');
      img.src = t.item.poster || placeholderPoster(t.index);
      img.alt = titleText;
      tile.appendChild(img);

      // Extract video thumbnail automatically
      if (t.item.src && !t.item.poster) {
        if (!extractThumbnail._cache) extractThumbnail._cache = {};
        const cache = extractThumbnail._cache;
        if (cache[t.item.src] instanceof Promise) {
          cache[t.item.src].then(url => { if (url) img.src = url; });
        } else if (typeof cache[t.item.src] === 'string') {
          img.src = cache[t.item.src];
        } else {
          cache[t.item.src] = extractThumbnail(t.item.src).then(url => {
            if (url) {
              cache[t.item.src] = url;
              document.querySelectorAll(`.dome-tile[data-index="${t.index}"] img`)
                .forEach(el => el.src = url);
            }
            return url;
          });
        }
      }

      const badge = document.createElement('div');
      badge.className = 'play-badge';
      badge.innerHTML = `<svg viewBox="0 0 24 24" fill="#FDF6E9"><path d="M8 5v14l11-7z"/></svg>`;
      tile.appendChild(badge);

      /* 
      // OUTSIDE TITLE BAR COMMENTED OUT
      const titleBar = document.createElement('div');
      titleBar.className = 'tile-title-bar';
      titleBar.textContent = titleText;
      tile.appendChild(titleBar); 
      */

      tile.addEventListener('click', () => {
        if (dragMoved) return;
        openVideo(t.index);
      });

      wrap.appendChild(tile);
      sphere.appendChild(wrap);
    });

    // ===== ROTATION INTERACTION =====
    const domeMain = document.getElementById('domeMain');
    const domeRoot = document.getElementById('domeRoot');

    let rotation = { x: 0, y: 0 };
    let dragging = false;
    let dragMoved = false;
    let startRot = { x: 0, y: 0 };
    let startPos = { x: 0, y: 0 };
    let lastPos = { x: 0, y: 0 };
    let velocity = { x: 0, y: 0 };
    let inertiaRAF = null;

    function applyRotation() {
      const radius = getRadius();
      sphere.style.transform = `translateZ(${-radius}px) rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
    }

    function stopInertia() {
      if (inertiaRAF) { cancelAnimationFrame(inertiaRAF); inertiaRAF = null; }
    }

    domeMain.addEventListener('pointerdown', (e) => {
      stopInertia();
      dragging = true;
      dragMoved = false;
      domeMain.classList.add('dragging');
      startRot = { ...rotation };
      startPos = { x: e.clientX, y: e.clientY };
      lastPos = { x: e.clientX, y: e.clientY };
      velocity = { x: 0, y: 0 };
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startPos.x;
      const dy = e.clientY - startPos.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;

      rotation.y = startRot.y + dx / 5;
      rotation.x = Math.max(-20, Math.min(20, startRot.x - dy / 8));
      applyRotation();

      velocity = { x: e.clientX - lastPos.x, y: e.clientY - lastPos.y };
      lastPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => {
      if (!dragging) return;
      dragging = false;
      domeMain.classList.remove('dragging');

      let vx = velocity.x;
      let vy = velocity.y;
      const friction = 0.94;

      function inertiaStep() {
        vx *= friction;
        vy *= friction;
        if (Math.abs(vx) < 0.05 && Math.abs(vy) < 0.05) { inertiaRAF = null; return; }
        rotation.y += vx / 5;
        rotation.x = Math.max(-20, Math.min(20, rotation.x - vy / 8));
        applyRotation();
        inertiaRAF = requestAnimationFrame(inertiaStep);
      }
      inertiaRAF = requestAnimationFrame(inertiaStep);
    });

    applyRotation();

    window.addEventListener('resize', () => {
      applyRotation();
    });

    // ===== OPEN / CLOSE VIEWER =====
    const domeScrim = document.getElementById('domeScrim');
    const domeVideoFrame = document.getElementById('domeVideoFrame');
    const domePlayer = document.getElementById('domePlayer');
    const domeCaption = document.getElementById('domeCaption');
    const domeClose = document.getElementById('domeClose');

    // Detect Google Drive share link and convert to embed URL
    function getDriveEmbedUrl(src) {
      const match = src && src.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (match) {
        return `https://drive.google.com/file/d/${match[1]}/preview`;
      }
      return null;
    }

    // Remove any existing Drive iframe
    function removeDriveFrame() {
      const old = domeVideoFrame.querySelector('.dome-drive-frame');
      if (old) old.remove();
    }

    function openVideo(index) {
      const item = videoItems[index];
      domeCaption.textContent = autoTitle(item.src, item.title);

      const existingMsg = domeVideoFrame.querySelector('.no-src-msg');
      if (existingMsg) existingMsg.remove();
      removeDriveFrame();

      const driveEmbed = getDriveEmbedUrl(item.src);

      if (driveEmbed) {
        // Google Drive video — use iframe embed
        domePlayer.style.display = 'none';
        domePlayer.pause();
        domePlayer.removeAttribute('src');

        const iframe = document.createElement('iframe');
        iframe.className = 'dome-drive-frame';
        iframe.src = driveEmbed;
        iframe.allow = 'autoplay';
        iframe.allowFullscreen = true;
        domeVideoFrame.appendChild(iframe);

      } else if (item.src) {
        domePlayer.style.display = 'block';
        domePlayer.src = item.src;
        domePlayer.poster = item.poster || placeholderPoster(index);
        domePlayer.currentTime = 0;
        domePlayer.play().catch(() => { });
      } else {
        domePlayer.style.display = 'none';
        domePlayer.removeAttribute('src');
        const msg = document.createElement('div');
        msg.className = 'no-src-msg';
        msg.textContent = `"${autoTitle(item.src, item.title)}" — Video path set karedaein!`;
        domeVideoFrame.appendChild(msg);
      }

      domeRoot.setAttribute('data-open', 'true');
    }

    function closeVideo() {
      domeRoot.removeAttribute('data-open');
      domePlayer.pause();
      domePlayer.removeAttribute('src');
      removeDriveFrame();
    }

    domeClose.addEventListener('click', closeVideo);
    domeScrim.addEventListener('click', closeVideo);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeVideo();
    });
  </script>
