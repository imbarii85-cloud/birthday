<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>3D Dome Video Gallery — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #0B1F3A;
      --navy-deep: #071429;
      --gold: #F4B942;
      --coral: #FF6F61;
      --cream: #FDF6E9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(ellipse at top, var(--navy) 0%, var(--navy-deep) 70%);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: var(--cream);
    }

    .page-head {
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .page-head h1 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.4rem;
      color: var(--gold);
      margin: 0 0 4px;
    }

    .page-head p {
      margin: 0;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* ===== DOME ROOT ===== */
    .dome-root {
      position: relative;
      width: 100%;
      height: 100vh;
      --radius: 460px;
    }

    .dome-main {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }

    .dome-main.dragging {
      cursor: grabbing;
    }

    .dome-stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: calc(var(--radius) * 2);
      perspective-origin: 50% 50%;
    }

    .dome-sphere {
      transform-style: preserve-3d;
      transform: translateZ(calc(var(--radius) * -1));
      will-change: transform;
    }

    .dome-item {
      position: absolute;
      top: -999px;
      bottom: -999px;
      left: -999px;
      right: -999px;
      margin: auto;
      width: 130px;
      height: 130px;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .dome-tile {
      position: absolute;
      inset: 6px;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: #0E2648;
      border: 1px solid rgba(244, 185, 66, 0.25);
      transition: transform 0.25s ease, border-color 0.25s ease, filter 0.25s ease;
      filter: saturate(0.5) brightness(0.75);
    }

    .dome-tile:hover {
      transform: scale(1.08);
      border-color: rgba(244, 185, 66, 0.7);
      filter: saturate(1) brightness(1);
      z-index: 5;
    }

    .dome-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .dome-tile .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 20, 41, 0.25);
      pointer-events: none;
    }

    .dome-tile .play-badge svg {
      width: 22px;
      height: 22px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    /* radial vignette so the dome fades into the background, no hard edges */
    .dome-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(rgba(235, 235, 235, 0) 55%, var(--navy-deep) 100%);
    }

    .dome-edge-fade {
      position: absolute;
      left: 0;
      right: 0;
      height: 140px;
      z-index: 4;
      pointer-events: none;
    }

    .dome-edge-fade--top {
      top: 0;
      background: linear-gradient(to bottom, var(--navy-deep), transparent);
    }

    .dome-edge-fade--bottom {
      bottom: 0;
      background: linear-gradient(to top, var(--navy-deep), transparent);
    }

    .dome-hint {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-size: 0.75rem;
      color: rgba(253, 246, 233, 0.55);
      text-align: center;
      pointer-events: none;
    }

    /* ===== VIEWER (opened video) ===== */
    .dome-viewer {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .dome-scrim {
      position: absolute;
      inset: 0;
      background: rgba(3, 6, 15, 0.82);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .dome-root[data-open="true"]~.dome-viewer .dome-scrim {
      opacity: 1;
      pointer-events: auto;
    }

    .dome-video-frame {
      position: relative;
      width: min(90vw, 560px);
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      transform: scale(0.6);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      pointer-events: none;
    }

    .dome-root[data-open="true"]~.dome-viewer .dome-video-frame {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .dome-video-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .dome-video-frame .no-src-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: var(--cream);
      background: linear-gradient(160deg, #16345E, #0A1D38);
    }

    .dome-caption {
      position: absolute;
      left: 14px;
      bottom: 14px;
      right: 50px;
      font-family: 'Baloo 2', sans-serif;
      font-size: 0.9rem;
      color: var(--cream);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .dome-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(7, 20, 41, 0.7);
      border: 1px solid rgba(244, 185, 66, 0.4);
      color: var(--gold);
      font-weight: 700;
      cursor: pointer;
      z-index: 2;
    }
  </style>
</head>

<body>

  <div class="page-head">
    <h1>🎥 Hamari Yaadgar Videos</h1>
    <p>Ghumao (drag karo) aur kisi bhi video par click karo</p>
  </div>

  <div class="dome-root" id="domeRoot">
    <main class="dome-main" id="domeMain">
      <div class="dome-stage">
        <div class="dome-sphere" id="domeSphere"><!-- tiles injected by JS --></div>
      </div>
      <div class="dome-overlay"></div>
      <div class="dome-edge-fade dome-edge-fade--top"></div>
      <div class="dome-edge-fade dome-edge-fade--bottom"></div>
    </main>
    <div class="dome-hint">🖱️ Drag karke ghumao • Video par click karke kholo</div>
  </div>

  <div class="dome-viewer">
    <div class="dome-scrim" id="domeScrim"></div>
    <div class="dome-video-frame" id="domeVideoFrame">
      <button class="dome-close" id="domeClose">✕</button>
      <video id="domePlayer" controls playsinline></video>
      <div class="dome-caption" id="domeCaption"></div>
    </div>
  </div>

  <script>
    /*
      ===== 3D DOME VIDEO GALLERY (vanilla HTML/CSS/JS) =====
      React Bits "DomeGallery" jaisa hi immersive 3D sphere effect, lekin
      bina React/@use-gesture/react ke — sirf CSS 3D transforms + native
      Pointer Events se bana hua hai.
    */

    // ===== EDIT THIS LIST — apni asal videos yahan daalo =====
    const videoItems = [
      { src: '', poster: null, title: 'Hamari Pehli Mulaqaat' },
      { src: '', poster: null, title: 'College Ke Din' },
      { src: '', poster: null, title: 'Woh Yadgar Safar' },
      { src: '', poster: null, title: 'Birthday Celebration' },
      { src: '', poster: null, title: 'Dosti Ke Lamhay' },
      { src: '', poster: null, title: 'Ghar Ki Party' },
      { src: '', poster: null, title: 'Surprise Moment' },
      { src: '', poster: null, title: 'Best Memories' }
    ];

    const placeholderColors = ['244,185,66', '255,111,97', '139,157,195', '46,125,79'];
    function placeholderPoster(index) {
      const color = placeholderColors[index % placeholderColors.length];
      const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="rgb(${color})" opacity="0.35"/>
      <polygon points="82,70 82,130 135,100" fill="rgb(${color})"/>
    </svg>
  `;
      return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }

    // ===== dome tile layout (adapted from DomeGallery's buildItems) =====
    const SEGMENTS = 22;
    const RADIUS = 560;
    function buildTiles(pool, segments) {
      const xCols = Array.from({ length: segments }, (_, i) => (i - (segments - 1) / 2) * 2);
      const evenYs = [-4, -2, 0, 2, 4];
      const oddYs = [-3, -1, 1, 3, 5];

      const coords = xCols.flatMap((x, c) => {
        const ys = c % 2 === 0 ? evenYs : oddYs;
        return ys.map(y => ({ x, y }));
      });

      const total = coords.length;
      const used = Array.from({ length: total }, (_, i) => pool[i % pool.length]);

      return coords.map((c, i) => ({ ...c, item: used[i], index: i % pool.length }));
    }

    const tiles = buildTiles(videoItems, SEGMENTS);
    const unit = 360 / SEGMENTS / 2;

    const sphere = document.getElementById('domeSphere');
    document.documentElement.style.setProperty('--radius', RADIUS + 'px');
    document.getElementById('domeRoot').style.setProperty('--radius', RADIUS + 'px');

    tiles.forEach(t => {
      const rotateY = unit * t.x;
      const rotateX = unit * t.y;

      const wrap = document.createElement('div');
      wrap.className = 'dome-item';
      wrap.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg) translateZ(${RADIUS}px)`;

      const tile = document.createElement('div');
      tile.className = 'dome-tile';
      tile.dataset.index = t.index;

      const img = document.createElement('img');
      img.src = t.item.poster || placeholderPoster(t.index);
      img.alt = t.item.title;
      tile.appendChild(img);

      const badge = document.createElement('div');
      badge.className = 'play-badge';
      badge.innerHTML = `<svg viewBox="0 0 24 24" fill="#FDF6E9"><path d="M8 5v14l11-7z"/></svg>`;
      tile.appendChild(badge);

      tile.addEventListener('click', () => {
        if (dragMoved) return;
        openVideo(t.index);
      });

      wrap.appendChild(tile);
      sphere.appendChild(wrap);
    });

    // ===== drag to rotate (with inertia) =====
    const domeMain = document.getElementById('domeMain');
    const domeRoot = document.getElementById('domeRoot');

    let rotation = { x: 0, y: 0 };
    let dragging = false;
    let dragMoved = false;
    let startRot = { x: 0, y: 0 };
    let startPos = { x: 0, y: 0 };
    let lastPos = { x: 0, y: 0 };
    let velocity = { x: 0, y: 0 };
    let inertiaRAF = null;

    function applyRotation() {
      sphere.style.transform = `translateZ(${-RADIUS}px) rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
    }

    function stopInertia() {
      if (inertiaRAF) { cancelAnimationFrame(inertiaRAF); inertiaRAF = null; }
    }

    domeMain.addEventListener('pointerdown', (e) => {
      stopInertia();
      dragging = true;
      dragMoved = false;
      domeMain.classList.add('dragging');
      startRot = { ...rotation };
      startPos = { x: e.clientX, y: e.clientY };
      lastPos = { x: e.clientX, y: e.clientY };
      velocity = { x: 0, y: 0 };
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startPos.x;
      const dy = e.clientY - startPos.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;

      rotation.y = startRot.y + dx / 6;
      rotation.x = Math.max(-15, Math.min(15, startRot.x - dy / 10));
      applyRotation();

      velocity = { x: e.clientX - lastPos.x, y: e.clientY - lastPos.y };
      lastPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => {
      if (!dragging) return;
      dragging = false;
      domeMain.classList.remove('dragging');

      let vx = velocity.x;
      let vy = velocity.y;
      const friction = 0.95;

      function inertiaStep() {
        vx *= friction;
        vy *= friction;
        if (Math.abs(vx) < 0.05 && Math.abs(vy) < 0.05) { inertiaRAF = null; return; }
        rotation.y += vx / 6;
        rotation.x = Math.max(-15, Math.min(15, rotation.x - vy / 10));
        applyRotation();
        inertiaRAF = requestAnimationFrame(inertiaStep);
      }
      inertiaRAF = requestAnimationFrame(inertiaStep);
    });

    applyRotation();

    // ===== open / close video viewer =====
    const domeScrim = document.getElementById('domeScrim');
    const domeVideoFrame = document.getElementById('domeVideoFrame');
    const domePlayer = document.getElementById('domePlayer');
    const domeCaption = document.getElementById('domeCaption');
    const domeClose = document.getElementById('domeClose');

    function openVideo(index) {
      const item = videoItems[index];
      domeCaption.textContent = item.title || '';

      const existingMsg = domeVideoFrame.querySelector('.no-src-msg');
      if (existingMsg) existingMsg.remove();

      if (item.src) {
        domePlayer.style.display = 'block';
        domePlayer.src = item.src;
        domePlayer.poster = item.poster || placeholderPoster(index);
        domePlayer.currentTime = 0;
        domePlayer.play().catch(() => { });
      } else {
        // no real video attached yet — show a placeholder message instead of crashing
        domePlayer.style.display = 'none';
        domePlayer.removeAttribute('src');
        const msg = document.createElement('div');
        msg.className = 'no-src-msg';
        msg.textContent = `"${item.title}" — yahan apni asal video ka path (src) laga dena, phir yeh yahan play hogi.`;
        domeVideoFrame.appendChild(msg);
      }

      domeRoot.setAttribute('data-open', 'true');
    }

    function closeVideo() {
      domeRoot.removeAttribute('data-open');
      domePlayer.pause();
    }

    domeClose.addEventListener('click', closeVideo);
    domeScrim.addEventListener('click', closeVideo);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeVideo();
    });
  </script>

</body>

</html>
