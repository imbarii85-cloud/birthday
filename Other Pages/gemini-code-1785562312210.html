<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Dome Video Gallery</title>
  <style>
    /* ==========================================================================
       1. Base Setup & Color Palette
       ========================================================================== */
    :root {
      --bg-color: #0b132b;
      /* Deep Navy */
      --accent-gold: #f4a261;
      /* Warm Gold */
      --accent-coral: #e76f51;
      /* Coral */
      --text-cream: #f8f9fa;
      /* Soft Cream */
      --card-bg: #1c2541;
      /* Dark Slate Navy */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-cream);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ==========================================================================
       2. Vignette & Edge Fades (Visual Overlays)
       ========================================================================== */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 30%, rgba(11, 19, 43, 0.8) 80%, rgba(11, 19, 43, 0.98) 100%);
      z-index: 10;
    }

    .edge-fade-top,
    .edge-fade-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 120px;
      pointer-events: none;
      z-index: 11;
    }

    .edge-fade-top {
      top: 0;
      background: linear-gradient(to bottom, var(--bg-color), transparent);
    }

    .edge-fade-bottom {
      bottom: 0;
      background: linear-gradient(to top, var(--bg-color), transparent);
    }

    /* ==========================================================================
       3. 3D Scene & Dome Structure
       ========================================================================== */
    .viewport {
      width: 100%;
      height: 100%;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .dome-stage {
      width: 0;
      height: 0;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* ==========================================================================
       4. Video Tiles
       ========================================================================== */
    .dome-tile {
      position: absolute;
      width: 160px;
      height: 90px;
      margin-left: -80px;
      margin-top: -45px;
      border-radius: 10px;
      overflow: hidden;
      background-color: var(--card-bg);
      border: 1px solid rgba(244, 162, 97, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition: filter 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
      filter: brightness(0.65) saturate(0.5);
      cursor: pointer;
    }

    .dome-tile:hover {
      filter: brightness(1) saturate(1);
      border-color: var(--accent-gold);
      box-shadow: 0 0 15px rgba(244, 162, 97, 0.4);
    }

    .dome-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .dome-tile .play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 19, 43, 0.3);
      opacity: 0.8;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .dome-tile:hover .play-icon {
      opacity: 1;
      transform: scale(1.1);
    }

    .play-icon svg {
      width: 28px;
      height: 28px;
      fill: var(--text-cream);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    /* ==========================================================================
       5. Modal Overlay & Active Player
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(11, 19, 43, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      width: 90%;
      max-width: 850px;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(244, 162, 97, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .modal-backdrop.active .modal-content {
      transform: scale(1);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      /* 16:9 Aspect Ratio */
      background: #000;
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .modal-info {
      padding: 16px 24px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-cream);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-cream);
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .close-btn:hover {
      background: var(--accent-coral);
      transform: scale(1.08);
    }
  </style>
</head>

<body>

  <!-- Visual Polish Overlays -->
  <div class="vignette-overlay"></div>
  <div class="edge-fade-top"></div>
  <div class="edge-fade-bottom"></div>

  <!-- 3D Scene Container -->
  <div class="viewport" id="viewport">
    <div class="dome-stage" id="domeStage"></div>
  </div>

  <!-- Modal Video Player -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-content">
      <button class="close-btn" id="closeBtn">&times;</button>
      <div class="video-wrapper">
        <video id="modalVideo" controls preload="none"></video>
      </div>
      <div class="modal-info">
        <div class="modal-title" id="modalTitle">Video Title</div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       Data Structure
       ========================================================================== */
    const galleryItems = [
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&q=80', title: 'Big Buck Bunny Trailer' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', title: 'Elephants Dream' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', poster: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80', title: 'For Bigger Blazes' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', poster: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&q=80', title: 'For Bigger Escapes' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4', poster: 'https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=500&q=80', title: 'For Bigger Fun' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4', poster: 'https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=500&q=80', title: 'For Bigger Joyrides' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4', poster: 'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500&q=80', title: 'For Bigger Meltdowns' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', poster: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500&q=80', title: 'Sintel Animated Short' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreet.mp4', poster: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&q=80', title: 'Subaru Outback' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', poster: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500&q=80', title: 'Tears of Steel VFX' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4', poster: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500&q=80', title: 'Bullrun Adventure' },
      { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WhatCarCanYouGetForAGrand.mp4', poster: 'https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?w=500&q=80', title: 'Grand Car Review' }
    ];

    /* ==========================================================================
       DOM Elements & State Initialization
       ========================================================================== */
    const viewport = document.getElementById('viewport');
    const domeStage = document.getElementById('domeStage');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalVideo = document.getElementById('modalVideo');
    const modalTitle = document.getElementById('modalTitle');
    const closeBtn = document.getElementById('closeBtn');

    // Sphere Configuration
    const RADIUS = 550; // Sphere Radius in Pixels
    const RINGS = [
      { count: 15, lat: 40 },   // Top Ring
      { count: 18, lat: 20 },   // Mid-Top Ring
      { count: 18, lat: 0 },    // Equatorial Ring
      { count: 18, lat: -20 },  // Mid-Bottom Ring
      { count: 15, lat: -40 }   // Bottom Ring
    ];

    // Physics & Rotation State
    let rotationX = -10;
    let rotationY = 0;
    let targetRotationX = -10;
    let targetRotationY = 0;
    let velX = 0;
    let velY = 0;

    let isDragging = false;
    let isModalOpen = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    /* ==========================================================================
       1. Dome Creation & Geometry Calculation
       ========================================================================== */
    function createDome() {
      let itemIndex = 0;

      RINGS.forEach(ring => {
        const phi = (90 - ring.lat) * (Math.PI / 180); // Latitude to radians

        for (let i = 0; i < ring.count; i++) {
          const theta = (i / ring.count) * (Math.PI * 2); // Longitude around ring
          const data = galleryItems[itemIndex % galleryItems.length];
          itemIndex++;

          // Create DOM Node
          const tile = document.createElement('div');
          tile.className = 'dome-tile';

          tile.innerHTML = `
            <img src="${data.poster}" alt="${data.title}" loading="lazy" />
            <div class="play-icon">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          `;

          // Calculate 3D Angles
          const rotateYDeg = theta * (180 / Math.PI);
          const rotateXDeg = -ring.lat;

          // CSS 3D Transformation
          tile.style.transform = `
            rotateY(${rotateYDeg}deg)
            rotateX(${rotateXDeg}deg)
            translateZ(${RADIUS}px)
          `;

          // Attach Click Event for Modal
          tile.addEventListener('click', (e) => {
            if (Math.abs(velX) < 0.2 && Math.abs(velY) < 0.2) { // Prevent opening on heavy drag
              openModal(data);
            }
          });

          domeStage.appendChild(tile);
        }
      });
    }

    /* ==========================================================================
       2. Inertia Physics & Animation Loop
       ========================================================================== */
    function updatePhysics() {
      if (isModalOpen) return;

      if (!isDragging) {
        // Friction dampening
        velX *= 0.93;
        velY *= 0.93;

        targetRotationY += velX;
        targetRotationX += velY;
      }

      // Smooth Lerp Towards Target Rotation
      rotationY += (targetRotationY - rotationY) * 0.15;
      rotationX += (targetRotationX - rotationX) * 0.15;

      // Vertical Rotation Limits (Clamp)
      targetRotationX = Math.max(-45, Math.min(45, targetRotationX));

      // Apply Matrix Transformation
      domeStage.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;

      requestAnimationFrame(updatePhysics);
    }

    /* ==========================================================================
       3. Pointer Events (Mouse / Touch Drag)
       ========================================================================== */
    viewport.addEventListener('pointerdown', (e) => {
      if (isModalOpen) return;
      isDragging = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      velX = 0;
      velY = 0;
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!isDragging || isModalOpen) return;

      const deltaX = e.clientX - lastPointerX;
      const deltaY = e.clientY - lastPointerY;

      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      // Sensitivity Multipliers
      velX = deltaX * 0.25;
      velY = -deltaY * 0.25;

      targetRotationY += velX;
      targetRotationX += velY;
    });

    viewport.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      viewport.releasePointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointercancel', () => {
      isDragging = false;
    });

    /* ==========================================================================
       4. Modal Player Logic
       ========================================================================== */
    function openModal(item) {
      isModalOpen = true;
      modalTitle.innerText = item.title;
      modalVideo.src = item.src;
      modalVideo.poster = item.poster;

      modalBackdrop.classList.add('active');
      modalVideo.play().catch(() => { }); // Autoplay handling
    }

    function closeModal() {
      isModalOpen = false;
      modalBackdrop.classList.remove('active');
      modalVideo.pause();
      modalVideo.src = ''; // Flush video buffer
      requestAnimationFrame(updatePhysics); // Resume dome loop smoothly
    }

    closeBtn.addEventListener('click', closeModal);

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isModalOpen) {
        closeModal();
      }
    });

    /* ==========================================================================
       5. Initialize
       ========================================================================== */
    createDome();
    requestAnimationFrame(updatePhysics);
  </script>
</body>

</html>
